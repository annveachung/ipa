<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPA Chart</title>
<meta name="description" content="A modern, interactive International Phonetic Alphabet chart with sound.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Charis+SIL&display=swap&text=%20%21%22%27%28%29%2B%2C-.%2F0123456789%3A%3B%3FABCDEFGHIJKLMNOPQRSTUVWXYZ%5B%5Dabcdefghijklmnopqrstuvwxyz%7C%C3%A6%C3%A7%C3%A8%C3%A9%C3%AA%C3%AB%C3%B0%C3%B8%C4%93%C4%95%C4%9B%C4%A7%C5%8B%C5%93%C7%80%C7%81%C7%82%C7%83%C8%85%C9%90%C9%91%C9%92%C9%93%C9%94%C9%95%C9%96%C9%97%C9%98%C9%99%C9%9A%C9%9B%C9%9C%C9%9E%C9%9F%C9%A0%C9%A1%C9%A2%C9%A3%C9%A4%C9%A5%C9%A6%C9%A7%C9%A8%C9%AA%C9%AB%C9%AC%C9%AD%C9%AE%C9%AF%C9%B0%C9%B1%C9%B2%C9%B3%C9%B4%C9%B5%C9%B6%C9%B8%C9%B9%C9%BA%C9%BB%C9%BD%C9%BE%CA%80%CA%81%CA%82%CA%83%CA%84%CA%88%CA%89%CA%8A%CA%8B%CA%8C%CA%8D%CA%8E%CA%8F%CA%90%CA%91%CA%92%CA%94%CA%95%CA%98%CA%99%CA%9B%CA%9C%CA%9D%CA%9F%CA%A1%CA%A2%CA%B0%CA%B2%CA%B7%CA%BC%CB%88%CB%8C%CB%90%CB%91%CB%9E%CB%A0%CB%A1%CB%A4%CB%A5%CB%A6%CB%A7%CB%A8%CB%A9%CC%80%CC%81%CC%82%CC%83%CC%84%CC%86%CC%88%CC%8A%CC%8B%CC%8C%CC%8F%CC%98%CC%99%CC%9A%CC%9C%CC%9D%CC%9E%CC%9F%CC%A0%CC%A4%CC%A5%CC%A9%CC%AA%CC%AC%CC%AF%CC%B0%CC%B4%CC%B9%CC%BA%CC%BB%CC%BC%CC%BD%CD%9C%CD%A1%CE%B2%CE%B8%CF%87%E1%B7%84%E1%B7%85%E1%B7%88%E1%BA%BD%E2%80%93%E2%80%94%E2%80%96%E2%80%98%E2%80%99%E2%80%9C%E2%80%9D%E2%80%A6%E2%80%BF%E2%81%BF%E2%86%97%E2%86%98%E2%97%8C%E2%B1%B1%EA%9C%9B%EA%9C%9C" rel="stylesheet">
<style>
  :root {
    --bg: #f1f0ec; --tile: #fff; --ink: #131313; --mute: #6d6c66; --soft: #f5f4f0; --soft2: #e9e8e3; --line: #0000000d; --rule: #13131317;
    --ac: #2f4bff; --ac-soft: #e8ecff; --ac-ink: #fff;
    --r: 28px; --gap: 14px; --row: clamp(200px, 17.4vw, 256px);
    --ease: cubic-bezier(.2,.8,.2,1);
    --ipa: 'Charis SIL', 'Doulos SIL', 'Gentium Plus', 'Noto Serif', serif;
    --hatch: repeating-linear-gradient(135deg, #13131322 0 1px, transparent 1px 6px);
  }
  * { box-sizing: border-box; margin: 0 }
  html { scroll-behavior: smooth }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 'Bricolage Grotesque', system-ui, sans-serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased }
  body.locked { overflow: hidden }
  a { color: inherit; text-decoration: none }
  button, input { font: inherit; color: inherit; background: none; border: 0 }
  button { cursor: pointer }
  :focus-visible { outline: 2px solid var(--ac); outline-offset: 2px }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; letter-spacing: .02em; text-transform: uppercase }
  .ipa { font-family: var(--ipa) }
  .wrap { width: min(1340px, calc(100% - 48px)); margin: 0 auto }
  .arrow { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--soft); transition: background .3s, color .3s, transform .45s var(--ease) }
  .arrow svg { width: 14px; height: 14px }

  /* ---------- top bar ---------- */
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0 18px; position: relative; z-index: 20 }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em }
  .brand i { width: 22px; height: 22px; border-radius: 7px; background: var(--ink); display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 4px }
  .brand i::before, .brand i::after { content: ''; border-radius: 2px; background: #fff } .brand i::after { background: var(--ac) }
  .bar { display: flex; gap: 4px; background: var(--tile); padding: 4px; border-radius: 99px; box-shadow: 0 0 0 1px var(--line); align-items: center }
  .bar a, .bar button { padding: 7px 14px; border-radius: 99px; font-weight: 500; font-size: 14px; transition: background .2s, color .2s; white-space: nowrap }
  .bar a:hover, .bar button:hover { background: var(--soft) }
  .bar .cta { background: var(--ink); color: #fff } .bar .cta:hover { background: var(--ac) }

  .search { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; height: 36px; border-radius: 99px; background: var(--soft); width: clamp(180px, 26vw, 320px) }
  .search svg { width: 15px; height: 15px; flex: none; color: var(--mute) }
  .search input { flex: 1; min-width: 0; height: 100%; outline: none; font-size: 14px }
  .search input::placeholder { color: var(--mute) }
  .search kbd { font: 500 11px 'Geist Mono', monospace; padding: 2px 7px; border-radius: 6px; background: var(--tile); color: var(--mute); box-shadow: 0 0 0 1px var(--line) }
  .results { position: absolute; top: calc(100% + 8px); right: 0; width: min(420px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; padding: 6px; border-radius: 20px; background: var(--tile);
             box-shadow: 0 0 0 1px var(--line), 0 24px 48px -16px #0000003a; display: none }
  .results.on { display: block }
  .results button { width: 100%; display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; padding: 6px 10px 6px 6px; border-radius: 14px; text-align: left }
  .results button:hover, .results button.on { background: var(--soft) }
  .results .g { height: 40px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; font: 400 22px/1 var(--ipa) }
  .results button.on .g, .results button:hover .g { background: var(--tile) }
  .results b { font-weight: 600; font-size: 14px; display: block } .results small { color: var(--mute); font-size: 12px }
  .results .empty { padding: 14px; color: var(--mute) }

  /* ---------- bento ---------- */
  .bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: var(--row); grid-auto-flow: dense; gap: var(--gap); padding-bottom: var(--gap) }
  .tile { position: relative; background: var(--tile); border-radius: var(--r); overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 1px 2px #0000000a; isolation: isolate;
          opacity: 0; transform: translateY(22px) scale(.985); transition: opacity .8s var(--ease), transform .8s var(--ease), box-shadow .35s var(--ease) }
  .tile.in { opacity: 1; transform: none }
  .w2 { grid-column: span 2 } .w4 { grid-column: span 4 } .h2 { grid-row: span 2 }
  .eb { display: flex; align-items: center; gap: 8px; color: var(--mute) }

  /* chart tiles */
  .chart-tile { display: flex; flex-direction: column; padding: 10px; cursor: pointer; text-align: left; width: 100%; height: 100% }
  .chart-tile .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 12px 12px 14px }
  .chart-tile h2 { font-size: clamp(20px, 1.8vw, 28px); font-weight: 700; letter-spacing: -.03em; line-height: 1.02; margin-top: 8px }
  .chart-tile .media { position: relative; flex: 1; min-height: 0; border-radius: calc(var(--r) - 10px); background: var(--soft); overflow: hidden; display: grid; place-items: center; padding: 14px }
  .chart-tile .media > * { transition: transform .9s var(--ease) }
  .tile.in.chart-tile:hover { transform: translateY(-5px); box-shadow: 0 0 0 1px var(--line), 0 22px 40px -22px #0000004d }
  .chart-tile:hover .media > * { transform: scale(1.03) }
  .chart-tile:hover .arrow { background: var(--ac); color: #fff; transform: rotate(-45deg) }
  .chart-tile .media .open { position: absolute; right: 10px; bottom: 10px; padding: 6px 10px; border-radius: 99px; background: #131313cc; color: #fff; backdrop-filter: blur(8px); opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .4s var(--ease) }
  .chart-tile:hover .media .open { opacity: 1; transform: none }

  /* intro */
  .intro { padding: 30px 32px; display: flex; flex-direction: column }
  .status { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px 7px 10px; border-radius: 99px; background: var(--soft); font-size: 13px; font-weight: 500 }
  .status b { width: 8px; height: 8px; border-radius: 50%; background: #1fbf6b; animation: ping 2.2s infinite }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 #1fbf6b66 } 70% { box-shadow: 0 0 0 7px #1fbf6b00 } 100% { box-shadow: 0 0 0 0 #1fbf6b00 } }
  .intro h1 { font-size: clamp(54px, 6.4vw, 104px); font-weight: 800; letter-spacing: -.045em; line-height: .86; margin: auto 0 18px }
  .intro h1 span { color: var(--ac) }
  .intro .role { font-size: clamp(18px, 1.5vw, 22px); font-weight: 500; letter-spacing: -.01em; margin-bottom: 10px }
  .intro .bl { color: var(--mute); font-size: 16px; max-width: 44ch }
  .intro .row { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; background: var(--ink); color: #fff; transition: background .25s, transform .25s var(--ease) }
  .btn:hover { background: var(--ac) } .btn.ghost { background: var(--soft); color: var(--ink) } .btn.ghost:hover { background: var(--soft2) }
  .btn svg { width: 14px; height: 14px }

  /* random symbol */
  .spot { padding: 22px; display: flex; flex-direction: column; background: var(--ink); color: #fff }
  .spot .eb { color: #ffffff99 } .spot .eb b { width: 7px; height: 7px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 0 3px #2f4bff40; animation: blink 1.6s infinite }
  @keyframes blink { 50% { opacity: .35 } }
  .spot .g { margin: auto 0 6px; font: 400 clamp(56px, 5vw, 76px)/1 var(--ipa) }
  .spot p { font-size: 15px; font-weight: 500; letter-spacing: -.01em; line-height: 1.2; color: #ffffffd9 }
  .spot .acts { display: flex; gap: 6px; margin-top: 12px }
  .spot .acts button { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; background: #ffffff1a; font-size: 13px; font-weight: 500; transition: background .2s }
  .spot .acts button:hover { background: var(--ac) }
  .spot .acts svg { width: 12px; height: 12px }

  /* tray tile */
  .tray-tile { padding: 22px 24px; display: flex; flex-direction: column; gap: 12px }
  .tray-tile h3 { font-size: clamp(20px, 1.7vw, 24px); font-weight: 700; letter-spacing: -.03em }
  .tray-tile p { color: var(--mute); font-size: 14px }
  .tray { display: flex; align-items: center; gap: 6px; margin-top: auto }
  .tray input { flex: 1; min-width: 0; height: 52px; padding: 0 18px; border-radius: 18px; background: var(--soft); font: 400 26px/1 var(--ipa); outline: none; transition: box-shadow .2s }
  .tray input:focus { box-shadow: 0 0 0 2px var(--ac) }
  .tray input::placeholder { font: 400 15px 'Bricolage Grotesque', sans-serif; color: var(--mute) }
  .ibtn { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 99px; display: inline-grid; place-items: center; background: var(--soft); font-weight: 600; font-size: 14px; transition: background .2s, color .2s }
  .ibtn:hover { background: var(--soft2) } .ibtn.dark { background: var(--ink); color: #fff } .ibtn.dark:hover { background: var(--ac) }
  .ibtn svg { width: 16px; height: 16px }

  /* credits */
  .credits { background: var(--ac); color: var(--ac-ink); padding: 24px 26px; display: flex; flex-direction: column; box-shadow: none }
  .credits .eb { color: #ffffffb3 }
  .credits h3 { font-size: clamp(32px, 3.4vw, 52px); font-weight: 800; letter-spacing: -.05em; line-height: .92; margin-top: auto }
  .credits p { font-size: 13px; color: #ffffffcc; margin-top: 12px; max-width: 62ch }
  .credits a { text-decoration: underline; text-underline-offset: 3px }

  footer { display: flex; justify-content: space-between; gap: 16px; padding: 22px 4px 40px; color: var(--mute); flex-wrap: wrap }
  footer a:hover { color: var(--ink) }

  /* ---------- the charts (shared by tiles and the focus view) ---------- */
  .sy { font-family: var(--ipa); line-height: 1; border-radius: 10px; display: inline-grid; place-items: center; transition: background .2s, color .2s, transform .35s var(--ease), box-shadow .2s, opacity .2s }
  button.sy:hover, button.sy.hov { background: var(--ac-soft); color: var(--ac); transform: scale(1.12) }
  button.sy.sel { background: var(--ac); color: #fff }
  button.sy.flash { background: var(--ink); color: #fff }
  .mini .sy { pointer-events: none }
  .dim .sy:not(.match) { opacity: .15 }

  /* pulmonic */
  .pulm { --lab: 150px; --rh: 62px; --fs: 30px; display: grid; grid-template-columns: var(--lab) repeat(22, minmax(0, 1fr)); grid-template-rows: auto repeat(8, var(--rh)); width: 100%; position: relative }
  .pulm .ph { padding: 0 2px 10px; font: 500 10.5px/1.15 'Geist Mono', monospace; letter-spacing: .02em; text-transform: uppercase; color: var(--mute); text-align: center; align-self: end; transition: color .2s }
  .pulm .rl { grid-column: 1; align-self: center; font-weight: 600; font-size: 15px; letter-spacing: -.01em; padding-right: 10px; transition: color .2s }
  .pulm .pc { border-top: 1px solid var(--rule); border-left: 1px solid var(--rule) }
  .pulm .imp { background: var(--hatch); z-index: 0 }
  .pulm .sy { z-index: 1; place-self: center; width: 1.45em; height: 1.45em; font-size: var(--fs) }
  .pulm .on { color: var(--ac) }
  .pulm .pa { display: none }
  .pulm:not(.mini) .corner { position: sticky; left: 0; z-index: 3; background: var(--tile); box-shadow: -30px 0 0 var(--tile) }
  .pulm:not(.mini) .rl { position: sticky; left: 0; z-index: 2; background: var(--tile); align-self: stretch; display: flex; align-items: center; box-shadow: -30px 0 0 var(--tile) }
  .pulm.mini { --lab: 64px; --rh: 1fr; --fs: clamp(13px, 1.25vw, 19px); height: 100%; grid-template-rows: auto repeat(8, 1fr) }
  .pulm.mini .ph { font-size: 8.5px; padding-bottom: 5px }
  .pulm.mini .rl { font-size: 10.5px; font-weight: 500; color: var(--mute); padding-right: 6px; line-height: 1.05 }

  /* vowels */
  .vow { display: grid; grid-template-columns: var(--vl, 92px) 1fr; grid-template-rows: auto 1fr; width: 100%; aspect-ratio: 1.45; max-height: 100%; --fs: 30px }
  .vow .tl { grid-column: 2; position: relative; height: 26px }
  .vow .tl span, .vow .ll span { position: absolute; font: 500 10.5px 'Geist Mono', monospace; text-transform: uppercase; color: var(--mute); white-space: nowrap }
  .vow .tl span { transform: translateX(-50%); bottom: 10px }
  .vow .ll { position: relative }
  .vow .ll span { right: 14px; transform: translateY(-50%) }
  .vow .plot { position: relative; margin: 18px 22px 18px 18px }
  .vow svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible }
  .vow svg line { stroke: #13131340; stroke-width: 1.5; vector-effect: non-scaling-stroke }
  .vow .dot { position: absolute; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: var(--ink) }
  .vow .sy { position: absolute; transform: translate(-50%, -50%); width: 1.4em; height: 1.4em; font-size: var(--fs); background: var(--tile) }
  .vow button.sy:hover, .vow button.sy.hov { transform: translate(-50%, -50%) scale(1.12) }
  .stage .vow { width: min(100%, calc((100vh - 300px) * 1.45)); min-width: 0 }
  .vow.mini { --vl: 0px; --fs: clamp(15px, 1.5vw, 22px); aspect-ratio: auto; height: 100% }
  .vow.mini .tl, .vow.mini .ll { display: none } .vow.mini .plot { margin: 6% 6%; grid-column: 1 / -1; grid-row: 1 / -1 }
  .vow.mini .sy { background: var(--soft) }
  .vow.mini .dot { width: 5px; height: 5px; margin: -2.5px }

  /* list-style charts: non-pulmonic, other symbols, diacritics, suprasegmentals, tones */
  .cols { display: grid; gap: 22px; width: 100%; align-self: start }
  .cols h4 { font: 500 11px 'Geist Mono', monospace; text-transform: uppercase; color: var(--mute); padding: 0 0 8px; border-bottom: 1px solid var(--rule); margin-bottom: 4px }
  .item { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--rule) }
  .item .sy { min-width: 1.7em; height: 1.45em; padding: 0 .15em; font-size: 26px }
  .item span { font-size: 13.5px; line-height: 1.25 } .item small { display: block; color: var(--mute); font: 400 14px var(--ipa) }
  .item.two { grid-template-columns: auto auto 1fr }

  .chips { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 6px; width: 100% }
  .chips .sy { width: 100%; aspect-ratio: 1; font-size: var(--fs, 22px); background: var(--tile); border-radius: 12px }
  .glyphrow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .glyphrow .sy { width: 1.7em; height: 1.7em; font-size: var(--fs, 22px); background: var(--tile); border-radius: 12px }

  /* ---------- focus view ---------- */
  .focus { position: fixed; inset: 0; z-index: 100; display: none }
  .focus.on { display: block }
  .scrim { position: absolute; inset: 0; background: #f1f0ecd9; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transition: opacity .4s var(--ease) }
  .focus.open .scrim { opacity: 1 }
  .sheet { position: absolute; inset: 16px; background: var(--tile); border-radius: var(--r); box-shadow: 0 0 0 1px var(--line), 0 40px 80px -30px #00000059; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden }
  .sh-hd { display: flex; align-items: center; gap: 12px; padding: 16px 16px 14px 26px; border-bottom: 1px solid var(--rule) }
  .sh-hd .ttl { flex: 1; min-width: 0 }
  .sh-hd h2 { font-size: clamp(22px, 2.2vw, 32px); font-weight: 800; letter-spacing: -.035em; line-height: 1 }
  .sh-hd .eb { margin-bottom: 6px }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 99px; background: var(--soft) }
  .seg button { padding: 7px 13px; border-radius: 99px; font-size: 13.5px; font-weight: 600; color: var(--mute); transition: background .2s, color .2s }
  .seg button[aria-pressed="true"] { background: var(--tile); color: var(--ink); box-shadow: 0 1px 3px #0000001f }
  .nav { display: flex; gap: 4px }
  .nav .ibtn { width: 40px; padding: 0 }
  .sh-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0 }
  .stage { overflow: auto; padding: 26px 30px; display: grid; place-items: center; min-height: 0 }
  .stage > * { max-width: 1180px }
  .stage .cols { align-self: center }
  .note { grid-column: 1 / -1; margin-top: 16px; color: var(--mute); font-size: 13px; text-align: center }

  .insp { border-left: 1px solid var(--rule); padding: 22px; overflow: auto; display: flex; flex-direction: column; gap: 16px; background: linear-gradient(var(--tile), var(--soft)) }
  .insp .big { height: 150px; border-radius: 22px; background: var(--soft); display: grid; place-items: center; font: 400 84px/1 var(--ipa); position: relative; transition: background .3s }
  .insp .big.has { background: var(--ac); color: #fff }
  .insp .big small { position: absolute; left: 14px; top: 12px; font: 500 11px 'Geist Mono', monospace; text-transform: uppercase; opacity: .7 }
  .insp h3 { font-size: 22px; font-weight: 700; letter-spacing: -.025em; line-height: 1.08 }
  .insp .hint { color: var(--mute); font-size: 14px }
  .insp dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px }
  .insp dt { color: var(--mute) } .insp dd { min-width: 0; overflow-wrap: anywhere } .insp dd .ipa { font-size: 16px }
  .listen { display: flex; flex-direction: column; gap: 6px }
  .listen button { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 7px; border-radius: 16px; background: var(--tile); box-shadow: 0 0 0 1px var(--line); text-align: left; transition: background .2s, box-shadow .2s }
  .listen button:hover { box-shadow: 0 0 0 1.5px var(--ac) }
  .listen button i { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; transition: background .2s }
  .listen button i svg { width: 11px; height: 11px }
  .listen button.playing i { background: var(--ac); animation: pulse 1s ease-in-out infinite }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px #2f4bff26 } }
  .listen b { font: 400 22px/1 var(--ipa) } .listen small { color: var(--mute); font-size: 12px; margin-left: auto }
  .insp .acts { display: flex; gap: 6px; flex-wrap: wrap }
  .insp .meta { display: flex; flex-direction: column; gap: 14px }

  .sh-ft { border-top: 1px solid var(--rule); padding: 12px 16px 12px 26px; display: flex; align-items: center; gap: 12px }
  .sh-ft .lbl { white-space: nowrap }
  .sh-ft .tray { margin: 0; flex: 1 }
  .sh-ft .tray input { height: 46px; font-size: 24px }

  .toast { position: fixed; left: 50%; bottom: 28px; z-index: 200; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 500; transition: opacity .2s, transform .35s var(--ease) }
  .toast.on { opacity: 1; transform: translate(-50%, 0) }

  /* ---------- responsive ---------- */
  @media (max-width: 1060px) {
    :root { --row: clamp(190px, 30vw, 260px) }
    .bento { grid-template-columns: repeat(2, minmax(0, 1fr)) }
    .w4 { grid-column: span 2 }
    .sh-body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto }
    .insp { border-left: 0; border-top: 1px solid var(--rule); flex-direction: row; flex-wrap: wrap; align-items: flex-start; max-height: 42vh }
    .insp .big { width: 110px; height: 110px; font-size: 60px; flex: none }
    .insp .meta { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 10px }
  }
  @media (max-width: 640px) {
    :root { --r: 24px; --gap: 12px }
    .wrap { width: calc(100% - 32px) }
    header.top { flex-wrap: wrap; padding: 16px 0 14px } .bar .hide-s { display: none }
    .search { width: auto; flex: 1 }
    .bento { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto }
    .w2, .w4, .h2 { grid-column: auto; grid-row: auto }
    .intro { padding: 24px 22px 22px; min-height: 400px } .intro h1 { margin-top: 48px }
    .chart-tile .media { flex: none; aspect-ratio: 4/3 }
    .chips .sy { aspect-ratio: auto; height: 48px }
    .chart-tile[data-t="0"] .media { aspect-ratio: 1.1 }
    .spot, .tray-tile, .credits { min-height: 240px }
    .sheet { inset: 0; border-radius: 0 }
    .sh-hd { flex-wrap: wrap; padding: 14px 14px 12px 18px } .sh-hd .seg { order: 3 }
    .stage { padding: 18px 16px; place-items: start }
    .pulm:not(.mini) { min-width: 700px; --lab: 104px; --rh: 52px; --fs: 24px }
    .pulm .pf { display: none } .pulm .pa { display: inline }
    .pulm:not(.mini) .rl { font-size: 13px }
    .vow:not(.mini) { min-width: 520px; --vl: 80px; --fs: 24px }
    .sh-ft { padding: 10px 14px } .sh-ft .lbl, .sh-ft .bk { display: none }
    .insp { padding: 14px 16px; gap: 12px; max-height: 46vh }
    .insp .big { width: 84px; height: 84px; font-size: 46px }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { opacity: 1; transform: none; transition: none } .chart-tile .media > * { transition: none }
    .status b, .spot .eb b, .listen button.playing i { animation: none }
  }
</style>
</head>

    }
  });
  IMP.forEach(([c, r]) => h += `<div class="imp" style="grid-column:${c + 1};grid-row:${r + 1}"></div>`);
  inChart(0).forEach(s => h += sy(s, mini).replace('class="sy"', `style="grid-column:${s.c + 1};grid-row:${s.r + 1}" class="sy"`));
  return h + '</div>';
}

function renderVowels(mini) {
  const X = c => (c - 4) / 32 * 100, Y = r => (r - 1) / 6 * 100;
  const front = r => X(8 + 2 * (r - 1)), central = r => X(20 + (r - 1));
  const lines = [
    [front(1), 0, front(7), 100], [central(1), 0, central(7), 100], [X(32), 0, X(32), 100],
    ...[1, 3, 5, 7].map(r => [front(r), Y(r), X(32), Y(r)]),
  ];
  const vs = inChart(4);
  const dots = vs.filter(s => vs.some(o => o.r === s.r && o.c === s.c + 4)).map(s => [X(s.c + 2), Y(s.r)]);
  let h = `<div class="vow${mini ? ' mini' : ''}">`;
  h += `<div class="tl">${[['Front', 8], ['Central', 20], ['Back', 32]].map(([l, c]) => `<span style="left:calc(18px + (100% - 40px) * ${X(c) / 100})">${l}</span>`).join('')}</div>`;
  h += `<div class="ll">${[['Close', 1], ['Close-mid', 3], ['Open-mid', 5], ['Open', 7]].map(([l, r]) => `<span style="top:calc(18px + (100% - 36px) * ${Y(r) / 100})">${l}</span>`).join('')}</div>`;
  h += `<div class="plot"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${lines.map(([a, b, c, d]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`).join('')}</svg>`;
  h += dots.map(([x, y]) => `<i class="dot" style="left:${x}%;top:${y}%"></i>`).join('');
  h += vs.map(s => sy(s, mini).replace('class="sy"', `style="left:${X(s.c)}%;top:${Y(s.r)}%" class="sy"`)).join('');
  return h + '</div></div>';
}

const label1 = s => cap(s.d.toLowerCase().replace(/^voiced /, '').replace(/ (click|implosive|ejective)$/, '')) || 'Ejective mark';
function renderNonPulmonic(mini) {
  const heads = ['Clicks', 'Voiced implosives', 'Ejectives'];
  if (mini) return `<div class="chips" style="--n:3;--fs:clamp(18px,1.7vw,26px);row-gap:8px">${[1, 2, 3, 4, 5].flatMap(r => [1, 2, 3].map(c => inChart(1).find(s => s.r === r && s.c === c))).map(s => sy(s, true)).join('')}</div>`;
  return `<div class="cols" style="grid-template-columns:repeat(3,minmax(0,1fr));min-width:min(720px,100%)">${heads.map((hd, c) =>
    `<div><h4>${hd}</h4>${inChart(1).filter(s => s.c === c + 1).sort((a, b) => a.r - b.r).map(s => `<div class="item">${sy(s)}<span>${esc(label1(s))}</span></div>`).join('')}</div>`).join('')}</div>`;
}

function renderList(t, mini, ncol) {
  const list = inChart(t).sort((a, b) => a.c - b.c || a.r - b.r);
  if (mini) return `<div class="glyphrow" style="--fs:${t === 3 ? 'clamp(19px,1.8vw,26px)' : 'clamp(22px,2vw,30px)'}">${list.map(s => sy(s, true)).join('')}</div>`;
  const per = Math.ceil(list.length / ncol);
  const cols = Array.from({ length: ncol }, (_, k) => list.slice(k * per, k * per + per));
  return `<div class="cols" style="grid-template-columns:repeat(${ncol},minmax(0,1fr));min-width:min(${ncol * 260}px,100%)">${cols.map(col =>
    `<div>${col.map(s => `<div class="item">${sy(s)}<span>${esc(s.name)}${(s.exs?.length || (s.ex && s.ex !== s.g)) ? `<small>${esc((s.exs?.length ? s.exs : [s.ex]).join('  '))}</small>` : ''}</span></div>`).join('')}</div>`).join('')}</div>`;
}

function renderTones(mini) {
  const T = inChart(6), at = (c, r) => T.find(s => s.c === c && s.r === r);
  if (mini) return `<div class="glyphrow" style="--fs:clamp(17px,1.6vw,24px)">${[1, 2, 3, 4, 5].flatMap(r => [at(1, r), at(2, r)]).concat([1, 2, 3, 4, 5].flatMap(r => [at(3, r), at(4, r)])).map(s => sy(s, true)).join('')}</div>`;
  const group = (c, title) => `<div><h4>${title}</h4>${[1, 2, 3, 4, 5, 6, 7].map(r => {
    const a = at(c, r), b = at(c + 1, r); if (!a) return '';
    return `<div class="item two">${sy(a)}${b ? sy(b) : '<span></span>'}<span>${esc(a.name.replace(/ \(Chao letter\)/, ''))}</span></div>`;
  }).join('')}</div>`;
  return `<div class="cols" style="grid-template-columns:repeat(2,minmax(0,1fr));min-width:min(680px,100%)">${group(1, 'Level')}${group(3, 'Contour')}</div>`;
}

const RENDER = {
  0: m => renderPulmonic(m), 4: m => renderVowels(m), 1: m => renderNonPulmonic(m),
  2: m => renderList(2, m, 2), 3: m => renderList(3, m, 3), 5: m => renderList(5, m, 1), 6: m => renderTones(m),
};

// ---------- bento ----------
const chartTile = (t, size) => {
  const c = CHARTS.find(x => x.t === t), n = inChart(t).length, i = CHARTS.indexOf(c);
  return `<button class="tile chart-tile ${size}" data-t="${t}" aria-label="Open ${esc(c.title)} chart">
    <div class="hd"><div><span class="eb mono">${pad(i + 1)} · ${n} symbols</span><h2>${esc(c.title)}</h2></div><span class="arrow">${ARROW}</span></div>
    <div class="media">${RENDER[t](true)}<span class="open mono">Open chart</span></div></button>`;
};
$('#bento').innerHTML = [
  `<section class="tile w2 h2 intro">
    <span class="status"><b></b>Interactive · ${DATA.length} symbols · with sound</span>
    <h1>The IPA<span>.</span></h1>
    <p class="role">International Phonetic Alphabet, every chart in one place</p>
    <p class="bl">Open a chart to focus on it. In Listen mode, click a symbol to hear the official recording; switch to Type to build a transcription.</p>
    <div class="row"><button class="btn" data-open="0">Open consonants ${ARROW}</button><button class="btn ghost" id="introSearch">Search symbols <kbd class="mono" style="opacity:.6">/</kbd></button></div>
  </section>`,
  chartTile(0, 'w2 h2'),
  chartTile(4, 'w2 h2'),
  chartTile(1, 'h2'),
  chartTile(2, 'h2'),
  chartTile(3, 'w2 h2'),
  chartTile(5, ''),
  `<section class="tile spot" aria-label="Random symbol">
    <span class="eb mono"><b></b>Try this one</span>
    <div class="g" id="rG"></div><p id="rN"></p>
    <div class="acts"><button id="rPlay">${PLAY.replace('<svg', '<svg width="12" height="12"')}Listen</button><button id="rNext">Shuffle</button></div>
  </section>`,
  chartTile(6, 'w2'),
  `<section class="tile w2 tray-tile" id="tray">
    <span class="eb mono">Transcription tray</span>
    <h3>Build a transcription</h3>
    <p>Type here, or open a chart in Type mode and click symbols. It's saved in this browser.</p>
    <div class="tray" data-tray></div>
  </section>`,
  `<section class="tile w2 credits" id="about">
    <span class="eb mono">About</span>
    <h3>Built on the official IPA Chart.</h3>
    <p>Chart content: <a href="https://www.internationalphoneticassociation.org/content/ipa-chart" target="_blank" rel="noopener">IPA Chart</a>, available under a Creative Commons Attribution-Sharealike 3.0 Unported License. Copyright © 2020 International Phonetic Association.
    Recordings by John Esling, Jill House, Peter Ladefoged and John Wells, played from the IPA's <a href="https://www.internationalphoneticassociation.org/IPAcharts/IPA_charts_EI/IPA_charts_EI.html" target="_blank" rel="noopener">interactive chart</a>.</p>
  </section>`,
].join('');

// staggered reveal (from the bento template)
const tiles = $$('.tile');
const io = new IntersectionObserver(es => {
  es.filter(e => e.isIntersecting).sort((a, b) => tiles.indexOf(a.target) - tiles.indexOf(b.target)).forEach((e, k) => {
    e.target.style.transitionDelay = `${k * 60}ms, ${k * 60}ms, 0ms`;
    e.target.classList.add('in'); io.unobserve(e.target);
    setTimeout(() => e.target.style.transitionDelay = '', 900 + k * 60);
  });
}, { rootMargin: '0px 0px -6% 0px' });
tiles.forEach(t => io.observe(t));

// ---------- tray (two synced inputs) ----------
const TRAY_HTML = `<input autocomplete="off" spellcheck="false" placeholder="Click symbols in Type mode, or type here…" aria-label="Transcription">
  <button class="ibtn bk" data-act="bk" aria-label="Delete last character"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5.5 3H14v10H5.5L1.5 8z"/><path d="M8 6l4 4M12 6l-4 4" stroke-linecap="round"/></svg></button>
  <button class="ibtn" data-act="clr">Clear</button>
  <button class="ibtn dark" data-act="cpy">Copy</button>`;
$$('[data-tray]').forEach(t => t.innerHTML = TRAY_HTML);
const trays = $$('[data-tray] input');
let lastTray = trays[0];
const setTray = (v, from) => { trays.forEach(i => { if (i !== from) i.value = v }); store.set('ipa.tray', v) };
setTray(store.get('ipa.tray') || '');
trays.forEach(i => {
  i.addEventListener('input', () => setTray(i.value, i));
  i.addEventListener('focus', () => lastTray = i);
});
function insert(text) {
  const i = $('#focus').classList.contains('on') ? trays[1] : lastTray;
  const a = i.selectionStart ?? i.value.length, b = i.selectionEnd ?? a;
  i.setRangeText(text, a, b, 'end'); setTray(i.value, i);
}
$$('[data-tray]').forEach(t => t.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const i = t.querySelector('input');
  if (b.dataset.act === 'clr') { i.value = ''; setTray('', i); i.focus() }
  if (b.dataset.act === 'bk') {
    const chars = [...i.value]; chars.pop(); i.value = chars.join(''); setTray(i.value, i);
  }
  if (b.dataset.act === 'cpy') {
    if (!i.value) return toast('Tray is empty');
    try { await navigator.clipboard.writeText(i.value); toast(`Copied “${i.value}”`) } catch { i.select(); toast('Press ⌘C / Ctrl+C to copy') }
  }
}));

// ---------- audio ----------
const audio = new Audio();
let playingBtn = null;
function clipURL(s, [g, f]) { return `${SOUND_BASE}${SPK[g]}/${s.u.replace(/ \+ /g, '_')}${f ? '_' + f : ''}.mp3` }
function play(s, k = 0, btn) {
  if (!s?.a?.length) return toast('No recording for this symbol');
  audio.src = clipURL(s, s.a[k]);
  if (playingBtn) playingBtn.classList.remove('playing');
  playingBtn = btn || $(`.listen button[data-k="${k}"]`);
  audio.play().catch(() => toast('Couldn’t load the recording'));
}
audio.addEventListener('playing', () => playingBtn?.classList.add('playing'));
['pause', 'ended', 'error'].forEach(ev => audio.addEventListener(ev, () => playingBtn?.classList.remove('playing')));

// ---------- toast ----------
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1700) }

// ---------- random symbol tile ----------
const playable = DATA.filter(s => s.a.length && s.t !== 6);
let rand;
function shuffle() {
  rand = playable[Math.floor(Math.random() * playable.length)];
  $('#rG').textContent = rand.g; $('#rN').textContent = rand.name;
}
shuffle();
$('#rNext').onclick = shuffle;
$('#rPlay').onclick = () => play(rand, 0, $('#rPlay'));

// ---------- focus view ----------
const focus = $('#focus'), sheet = $('#sheet'), stage = $('#stage'), insp = $('#insp');
let cur = null, sel = null, opener = null;
let mode = store.get('ipa.mode') === 'type' ? 'type' : 'listen';
const paintMode = () => $$('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
paintMode();
$$('.seg button').forEach(b => b.onclick = () => { mode = b.dataset.mode; store.set('ipa.mode', mode); paintMode() });

function showChart(t, symId) {
  const c = CHARTS.find(x => x.t === t), i = CHARTS.indexOf(c);
  cur = t;
  $('#fEb').textContent = `${pad(i + 1)} / ${pad(CHARTS.length)} · ${inChart(t).length} symbols`;
  $('#fTitle').textContent = c.title;
  stage.innerHTML = RENDER[t](false) + `<p class="note">${esc(c.note)}</p>`;
  stage.scrollTo(0, 0);
  select(symId ? BY.get(symId) : null);
  if (symId) { const b = stage.querySelector(`.sy[data-id="${symId}"]`); b?.scrollIntoView({ block: 'center', inline: 'center' }); b?.focus({ preventScroll: true }) }
}

function inspect(s, pinned) {
  if (!s) {
    insp.innerHTML = `<div class="big"><small>${esc(CHARTS.find(c => c.t === cur).short)}</small>${esc(inChart(cur)[0].g)}</div>
      <div class="meta"><h3>Pick a symbol</h3><p class="hint">${mode === 'type' ? 'Type mode: clicking a symbol adds it to the tray below.' : 'Listen mode: click a symbol to hear it and see its details.'}<br><br>Hover to preview · ← → switch charts · Esc closes</p></div>`;
    return;
  }
  const ex = s.exs?.length ? s.exs.join(', ') : s.ex;
  insp.innerHTML = `<div class="big has"><small>${pinned ? 'Selected' : 'Preview'}</small>${esc(s.g)}</div>
    <div class="meta">
      <h3>${esc(s.name)}</h3>
      <dl>
        <dt>Unicode</dt><dd>${uplus(s)}<br><span style="color:var(--mute)">${esc(cap(s.un.toLowerCase()))}</span></dd>
        ${s.n ? `<dt>IPA no.</dt><dd>${esc(s.n)}${s.in ? ` · ${esc(s.in)}` : ''}</dd>` : ''}
        ${ex ? `<dt>Example</dt><dd class="ipa">${ex}</dd>` : ''}
      </dl>
      ${s.a.length ? `<div class="listen">${s.a.map((a, k) => `<button data-k="${k}">${'<i>' + PLAY + '</i>'}<b>${esc(a[1] === 0 ? s.g : a[2])}</b><small>${SPEAKERS[a[0]]}</small></button>`).join('')}</div>` : '<p class="hint">No recording for this symbol.</p>'}
      <div class="acts"><button class="ibtn dark" data-ins>Add to tray</button><button class="ibtn" data-copy>Copy</button></div>
    </div>`;
}
insp.addEventListener('click', async e => {
  const s = sel ?? hoverSym; if (!s) return;
  const lb = e.target.closest('.listen button'); if (lb) return play(s, +lb.dataset.k, lb);
  if (e.target.closest('[data-ins]')) { insert(s.s); toast(`Added ${s.g}`) }
  if (e.target.closest('[data-copy]')) { try { await navigator.clipboard.writeText(s.s); toast(`Copied ${s.g}`) } catch { toast('Couldn’t copy') } }
});

let hoverSym = null;
function select(s) {
  $$('.sy.sel', stage).forEach(b => b.classList.remove('sel'));
  sel = s;
  if (s) stage.querySelector(`.sy[data-id="${s.id}"]`)?.classList.add('sel');
  inspect(s, true);
}
function hover(s) {
  hoverSym = s;
  $$('.pulm .on', stage).forEach(el => el.classList.remove('on'));
  if (s && s.t === 0) {
    stage.querySelector(`.rl[data-r="${s.r}"]`)?.classList.add('on');
    stage.querySelector(`.ph[data-p="${Math.floor((s.c - 1) / 2)}"]`)?.classList.add('on');
  }
  if (s) inspect(s, s === sel); else inspect(sel, true);
}
stage.addEventListener('pointerover', e => { const b = e.target.closest('button.sy'); if (b) hover(BY.get(+b.dataset.id)) });
stage.addEventListener('pointerleave', () => hover(null));
stage.addEventListener('focusin', e => { const b = e.target.closest('button.sy'); if (b) hover(BY.get(+b.dataset.id)) });
stage.addEventListener('click', e => {
  const b = e.target.closest('button.sy'); if (!b) return;
  const s = BY.get(+b.dataset.id);
  select(s);
  if (mode === 'type') { insert(s.s); b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 200) }
  else play(s, 0);
});

function open(t, fromEl, symId) {
  opener = fromEl || document.activeElement;
  focus.classList.add('on'); focus.setAttribute('aria-hidden', 'false'); document.body.classList.add('locked');
  showChart(t, symId);
  const r = fromEl?.getBoundingClientRect?.();
  if (r && !reduce && r.width) {
    const end = sheet.getBoundingClientRect();
    sheet.animate([
      { transform: `translate(${r.left - end.left}px, ${r.top - end.top}px) scale(${r.width / end.width}, ${r.height / end.height})`, transformOrigin: '0 0', borderRadius: '28px' },
      { transform: 'none', transformOrigin: '0 0' },
    ], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
  requestAnimationFrame(() => focus.classList.add('open'));
  if (!symId) $('#close').focus({ preventScroll: true });
}
function close() {
  if (!focus.classList.contains('on')) return;
  audio.pause();
  const tile = $(`.chart-tile[data-t="${cur}"]`);
  let done = false;
  const finish = () => { if (done) return; done = true; focus.classList.remove('on', 'open'); focus.setAttribute('aria-hidden', 'true'); document.body.classList.remove('locked'); (tile || opener)?.focus?.({ preventScroll: true }) };
  focus.classList.remove('open');
  const r = tile?.getBoundingClientRect();
  if (r && !reduce && r.bottom > 0 && r.top < innerHeight) {
    const end = sheet.getBoundingClientRect();
    sheet.animate([
      { transform: 'none', transformOrigin: '0 0', opacity: 1 },
      { transform: `translate(${r.left - end.left}px, ${r.top - end.top}px) scale(${r.width / end.width}, ${r.height / end.height})`, transformOrigin: '0 0', opacity: 0 },
    ], { duration: 380, easing: 'cubic-bezier(.4,0,.2,1)' }).onfinish = finish;
    setTimeout(finish, 450);
  } else finish();
}
const step = d => { const i = CHARTS.findIndex(c => c.t === cur); showChart(CHARTS[(i + d + CHARTS.length) % CHARTS.length].t) };
$('#close').onclick = close; $('#scrim').onclick = close;
$('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1);
document.addEventListener('click', e => {
  const t = e.target.closest('.chart-tile, [data-open]'); if (!t) return;
  const ty = +(t.dataset.t ?? t.dataset.open);
  open(ty, t.classList.contains('chart-tile') ? t : $(`.chart-tile[data-t="${ty}"]`));
});

// keep keyboard focus inside the dialog
focus.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const f = $$('button, input, [tabindex]:not([tabindex="-1"])', sheet).filter(el => el.offsetParent !== null);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus() }
  else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus() }
});

// ---------- search ----------
const q = $('#q'), results = $('#results');
let hits = [], hi = 0;
function search() {
  const raw = q.value.trim(), t = raw.toLowerCase();
  if (!t) { results.classList.remove('on'); hits = []; return }
  const words = t.split(/\s+/);
  hits = DATA.filter(s => s.s === raw || words.every(w => s.hay.includes(w)))
    .sort((a, b) => (b.s === raw) - (a.s === raw)).slice(0, 12);
  hi = 0;
  results.innerHTML = hits.length ? hits.map((s, k) => `<button role="option" data-id="${s.id}" class="${k === 0 ? 'on' : ''}"><span class="g">${esc(s.g)}</span><span><b>${esc(s.name)}</b><small>${esc(s.chart.short)} · ${uplus(s)}</small></span>${s.a.length ? '<small>♪</small>' : ''}</button>`).join('')
    : `<div class="empty">No symbols match “${esc(raw)}”.</div>`;
  results.classList.add('on');
}
const pick = s => { results.classList.remove('on'); q.blur(); open(s.t, $(`.chart-tile[data-t="${s.t}"]`), s.id) };
q.addEventListener('input', search);
q.addEventListener('focus', search);
q.addEventListener('blur', () => setTimeout(() => results.classList.remove('on'), 150));
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!hits.length) return;
    hi = (hi + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length;
    $$('button', results).forEach((b, k) => b.classList.toggle('on', k === hi));
    $$('button', results)[hi].scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter' && hits[hi]) pick(hits[hi]);
  if (e.key === 'Escape') { q.value = ''; search(); q.blur() }
});
results.addEventListener('mousedown', e => { const b = e.target.closest('button'); if (b) { e.preventDefault(); pick(BY.get(+b.dataset.id)) } });
$('#introSearch').onclick = () => q.focus();

// ---------- global keys ----------
addEventListener('keydown', e => {
  const typing = e.target.matches('input');
  if (e.key === '/' && !typing) { e.preventDefault(); if (focus.classList.contains('on')) close(); q.focus(); return }
  if (!focus.classList.contains('on')) return;
  if (e.key === 'Escape') { e.preventDefault(); close(); return }
  if (typing) return;
  if (e.key === 'ArrowRight' && !e.target.closest('.sy')) step(1);
  if (e.key === 'ArrowLeft' && !e.target.closest('.sy')) step(-1);
});
</script>
</body>
</html>
